<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create your account — v1</title>
</head>
<body>
  <main>
    <h1>Create your account</h1>

    <!-- v1: the "stable" page the selector was authored against. The terms checkbox
         carries a hand-picked id, so the obvious (brittle) selector is //input[@id='accept-terms']. -->
    <form id="signup" method="post" action="/signup">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>

      <div class="consent">
        <label>
          <input id="accept-terms" name="terms" type="checkbox" required>
          <span>I accept the terms and conditions</span>
        </label>
      </div>

      <button type="submit">Sign up</button>
    </form>
  </main>
</body>
</html>
