<text x="24" y="1038" font-size="12" fill="#c3c2b7">A note under a mark gives the limit or the evidence. "per README" means the project says so; it was not tested here.</text>
<text x="24" y="1060" font-size="12" fill="#c3c2b7">Healenium means the open source edition, Web and Proxy. Healenium Pro adds an LLM and Playwright.</text>
