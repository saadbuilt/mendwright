<text x="20" y="58" xml:space="preserve"><tspan class="p f15">$</tspan> <tspan class="c f0">m</tspan><tspan class="c f1">e</tspan><tspan class="c f2">n</tspan><tspan class="c f3">d</tspan><tspan class="c f4">w</tspan><tspan class="c f5">r</tspan><tspan class="c f6">i</tspan><tspan class="c f7">g</tspan><tspan class="c f8">h</tspan><tspan class="c f9">t</tspan><tspan class="c f10"> </tspan><tspan class="c f11">d</tspan><tspan class="c f12">e</tspan><tspan class="c f13">m</tspan><tspan class="c f14">o</tspan></text>
<text x="20" y="78" class="o16" xml:space="preserve"><tspan class="b">mendwright demo: a redesign breaks two selectors on a checkout page.</tspan></text>
<text x="20" y="98" class="o17" xml:space="preserve">Offline: a stand-in page (lxml, no browser) and a scripted model reply (no API call).</text>
<text x="20" y="138" class="o19" xml:space="preserve">  v1  accept_terms  #accept-terms  <tspan class="g">ok</tspan>     matched, box checked</text>
<text x="20" y="158" class="o20" xml:space="preserve">  v1  pay           #pay           <tspan class="g">ok</tspan>     matched (not clicked)</text>
<text x="20" y="178" class="o21" xml:space="preserve">      <tspan class="d">-- v2: a redesign ships and both ids are gone --</tspan></text>
<text x="20" y="198" class="o22" xml:space="preserve">  v2  accept_terms  #accept-terms  <tspan class="r">MISS</tspan>   no element matches</text>
<text x="20" y="218" class="o23" xml:space="preserve">      model    proposed //label[contains(normalize-space(.),'accept the terms')]//input[@type='checkbox']</text>
<text x="20" y="238" class="o23" xml:space="preserve">               <tspan class="y">(scripted reply, no API call)</tspan></text>
<text x="20" y="258" class="o24" xml:space="preserve">      checks   <tspan class="g">pass</tspan>: 1 checkbox in the captured HTML, 1 match on the live page</text>
<text x="20" y="278" class="o25" xml:space="preserve">      retry    <tspan class="g">ok</tspan>: box checked with the healed selector, heal confirmed</text>
<text x="20" y="298" class="o26" xml:space="preserve">  v2  pay           #pay           <tspan class="r">MISS</tspan>   no element matches</text>
<text x="20" y="318" class="o27" xml:space="preserve">      <tspan class="y">refused</tspan>  'pay' is marked destructive=True. Not healed, no model call.</text>
<text x="20" y="358" class="o29" xml:space="preserve"><tspan class="b">Done:</tspan> 1 heal applied and confirmed, 1 refused, 1 model call in total.</text>
