<svg xmlns="http://www.w3.org/2000/svg" width="900" height="396" viewBox="0 0 900 396" role="img" aria-labelledby="title desc">
<title id="title">mendwright demo in a terminal</title>
<desc id="desc">A terminal. $ mendwright demo / mendwright demo: a redesign breaks two selectors on a checkout page. / Offline: a stand-in page (lxml, no browser) and a scripted model reply (no API call). / v1  accept_terms  #accept-terms  ok     matched, box checked / v1  pay           #pay           ok     matched (not clicked) / -- v2: a redesign ships and both ids are gone -- / v2  accept_terms  #accept-terms  MISS   no element matches / model    proposed //label[contains(normalize-space(.),'accept the terms')]//input[@type='checkbox'] (scripted reply, no API call) / checks   pass: 1 checkbox in the captured HTML, 1 match on the live page / retry    ok: box checked with the healed selector, heal confirmed / v2  pay           #pay           MISS   no element matches / refused  'pay' is marked destructive=True. Not healed, no model call. / Done: 1 heal applied and confirmed, 1 refused, 1 model call in total.</desc>
