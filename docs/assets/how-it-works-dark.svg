<svg xmlns="http://www.w3.org/2000/svg" width="800" height="747" viewBox="0 0 800 747" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">How a heal works</title>
<desc id="desc">Flow: a selector misses; a key marked destructive, an unknown role or a used-up hourly limit stops with AttentionRequired before any model call; otherwise the page is captured and redacted, a model proposes an XPath, and local checks run (not a brittle index path, not quarantined or superseded for this key, exactly one match, expected role, unique, visible and the same role on the live page); a failure gives the model the reason and one more try, and a second failure raises AttentionRequired with nothing saved; a pass is saved and the step retried; if the action then fails the healed selector is quarantined.</desc>
<rect x="0.5" y="0.5" width="799" height="746" rx="12" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.1"/>
<text x="24" y="42" font-size="18" font-weight="600" fill="#ffffff">How a heal works</text>
<text x="24" y="66" font-size="13" fill="#c3c2b7">What mendwright does when a stored selector stops matching.</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#898781"/></marker></defs>
<g class="node">
<rect x="24" y="92" width="340" height="40" rx="20" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<text x="194" y="116" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">A stored selector stops matching</text>
</g>
<line x1="194" y1="132" x2="194" y2="157" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="node">
<rect x="24" y="158" width="340" height="70" rx="10" fill="#1a1a19" stroke="#3987e5" stroke-width="1.5"/>
<text x="194" y="180" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Refuse before asking the model?</text>
<text x="194" y="198" font-size="12" fill="#c3c2b7" text-anchor="middle">key marked destructive, role unknown,</text>
<text x="194" y="215" font-size="12" fill="#c3c2b7" text-anchor="middle">or hourly limit used up</text>
</g>
<line x1="364" y1="193" x2="469" y2="193" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="417" y="185" font-size="12" fill="#c3c2b7" text-anchor="middle">yes</text>
<g class="node">
<rect x="470" y="164" width="306" height="58" rx="10" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<circle cx="492" cy="193" r="9" fill="#d03b3b"/>
<line x1="492" y1="188.5" x2="492" y2="194" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<circle cx="492" cy="197.3" r="1.2" fill="#ffffff"/>
<text x="512" y="188.5" font-size="14" font-weight="600" fill="#ffffff">Stop and raise AttentionRequired</text>
<text x="512" y="206.5" font-size="12" fill="#c3c2b7">The model is not called.</text>
</g>
<line x1="194" y1="228" x2="194" y2="253" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="204" y="245" font-size="12" fill="#c3c2b7">no</text>
<g class="node">
<rect x="24" y="254" width="340" height="58" rx="10" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<text x="194" y="278.5" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Capture the page</text>
<text x="194" y="296.5" font-size="12" fill="#c3c2b7" text-anchor="middle">HTML snapshot, redacted first</text>
</g>
<line x1="194" y1="312" x2="194" y2="337" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="node">
<rect x="24" y="338" width="340" height="58" rx="10" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<text x="194" y="362.5" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">The model proposes an XPath</text>
<text x="194" y="380.5" font-size="12" fill="#c3c2b7" text-anchor="middle">from the provider you configured</text>
</g>
<line x1="194" y1="396" x2="194" y2="421" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<g class="node">
<rect x="24" y="422" width="340" height="139" rx="10" fill="#1a1a19" stroke="#3987e5" stroke-width="1.5"/>
<text x="44" y="447" font-size="14" font-weight="600" fill="#ffffff">Local checks, all must pass</text>
<circle cx="49" cy="465" r="2.5" fill="#3987e5"/>
<text x="60" y="469" font-size="13" fill="#c3c2b7">not a brittle index path</text>
<circle cx="49" cy="484" r="2.5" fill="#3987e5"/>
<text x="60" y="488" font-size="13" fill="#c3c2b7">not quarantined or superseded for this key</text>
<circle cx="49" cy="503" r="2.5" fill="#3987e5"/>
<text x="60" y="507" font-size="13" fill="#c3c2b7">exactly one match in the snapshot</text>
<circle cx="49" cy="522" r="2.5" fill="#3987e5"/>
<text x="60" y="526" font-size="13" fill="#c3c2b7">the expected role</text>
<circle cx="49" cy="541" r="2.5" fill="#3987e5"/>
<text x="60" y="545" font-size="13" fill="#c3c2b7">unique, visible and the same role on the live page</text>
</g>
<line x1="364" y1="491.5" x2="469" y2="491.5" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="417" y="483.5" font-size="12" fill="#c3c2b7" text-anchor="middle">fail</text>
<g class="node">
<rect x="470" y="456.5" width="306" height="70" rx="10" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<circle cx="492" cy="491.5" r="9" fill="#d03b3b"/>
<line x1="492" y1="487" x2="492" y2="492.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<circle cx="492" cy="495.8" r="1.2" fill="#ffffff"/>
<text x="512" y="478.5" font-size="14" font-weight="600" fill="#ffffff">One more try, with the reason</text>
<text x="512" y="496.5" font-size="12" fill="#c3c2b7">If that fails too: AttentionRequired,</text>
<text x="512" y="513.5" font-size="12" fill="#c3c2b7">with the reason. Nothing is saved.</text>
</g>
<line x1="194" y1="561" x2="194" y2="586" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="204" y="578" font-size="12" fill="#c3c2b7">pass</text>
<g class="node">
<rect x="24" y="587" width="340" height="58" rx="10" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<text x="194" y="611.5" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">Save it and retry the step</text>
<text x="194" y="629.5" font-size="12" fill="#c3c2b7" text-anchor="middle">in .mendwright/overrides.json</text>
</g>
<line x1="364" y1="616" x2="469" y2="616" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="417" y="608" font-size="12" fill="#c3c2b7" text-anchor="middle">action fails</text>
<g class="node">
<rect x="470" y="587" width="306" height="58" rx="10" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<circle cx="492" cy="616" r="9" fill="#d03b3b"/>
<line x1="487.5" y1="616" x2="496.5" y2="616" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
<text x="512" y="611.5" font-size="14" font-weight="600" fill="#ffffff">Quarantine the healed selector</text>
<text x="512" y="629.5" font-size="12" fill="#c3c2b7">so it is not used again</text>
</g>
<line x1="194" y1="645" x2="194" y2="670" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="204" y="662" font-size="12" fill="#c3c2b7">action works</text>
<g class="node">
<rect x="24" y="671" width="340" height="40" rx="20" fill="#1a1a19" stroke="#383835" stroke-width="1"/>
<text x="194" y="695" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">The step continues</text>
</g>
<text x="24" y="727" font-size="12" fill="#c3c2b7">Code: mendwright/facade.py, coordinator.py and gate.py.</text>
</svg>
