<svg xmlns="http://www.w3.org/2000/svg" width="800" height="444" viewBox="0 0 800 444" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="title">Download before the first heal, including services</title>
<desc id="desc">Bar chart. mendwright: 5.35 MB; Healenium-Web: 512.3 MB; Healenium-Proxy for Python: 2215.7 MB.</desc>
<rect x="0.5" y="0.5" width="799" height="443" rx="12" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.1"/>
<text x="24" y="42" font-size="18" font-weight="600" fill="#ffffff">Download before the first heal, including services</text>
<text x="24" y="66" font-size="13" fill="#c3c2b7">Compressed sizes for Linux x86_64. Docker totals are upper bounds.</text>
<rect x="24" y="85" width="12" height="12" rx="3" fill="#3987e5"/>
<text x="42" y="95.5" font-size="13" fill="#c3c2b7">The tool, its dependencies and services</text>
<rect x="312.6" y="85" width="12" height="12" rx="3" fill="#d95926"/>
<text x="330.6" y="95.5" font-size="13" fill="#c3c2b7">Selenium hub and 1 Chromium node (includes a browser)</text>
<text x="24" y="128" font-size="13"><tspan font-weight="600" fill="#ffffff">mendwright</tspan><tspan dx="8" fill="#c3c2b7">2 wheels: mendwright and lxml</tspan></text>
<line x1="24" y1="135" x2="24" y2="159" stroke="#898781" stroke-width="1"/>
<path class="bar" d="M24 138H25A1 1 0 0 1 26 139V155A1 1 0 0 1 25 156H24z" fill="#3987e5"/>
<text x="34" y="151.5" font-size="13" font-weight="600" fill="#ffffff">5.35 MB</text>
<text x="24" y="173" font-size="12" fill="#c3c2b7">mendwright 0.25 MB + lxml 5.11 MB (wheel files)</text>
<text x="24" y="209" font-size="13"><tspan font-weight="600" fill="#ffffff">Healenium-Web</tspan><tspan dx="8" fill="#c3c2b7">3 Docker images</tspan></text>
<line x1="24" y1="216" x2="24" y2="240" stroke="#898781" stroke-width="1"/>
<path class="bar" d="M24 219H173.06A4 4 0 0 1 177.06 223V233A4 4 0 0 1 173.06 237H24z" fill="#3987e5"/>
<text x="185.06" y="232.5" font-size="13" font-weight="600" fill="#ffffff">512.3 MB</text>
<text x="24" y="254" font-size="12" fill="#c3c2b7">postgres 94.8 MB + hlm-backend 317.4 MB + hlm-selector-imitator 100.1 MB</text>
<text x="24" y="290" font-size="13"><tspan font-weight="600" fill="#ffffff">Healenium-Proxy for Python</tspan><tspan dx="8" fill="#c3c2b7">4 Healenium images, Selenium hub, 1 Chromium node</tspan></text>
<line x1="24" y1="297" x2="24" y2="321" stroke="#898781" stroke-width="1"/>
<path class="bar" d="M24 300h250.33v18h-250.33z" fill="#3987e5"/>
<path class="bar" d="M276.33 300H682A4 4 0 0 1 686 304V314A4 4 0 0 1 682 318H276.33z" fill="#d95926"/>
<text x="694" y="313.5" font-size="13" font-weight="600" fill="#ffffff">2,215.7 MB</text>
<text x="24" y="335" font-size="12" fill="#c3c2b7">Healenium services 841.2 MB + Selenium hub and Chromium node 1,374.5 MB</text>
<text x="24" y="363" font-size="12" fill="#c3c2b7">Upper bounds: base layers shared between images are counted once per image. Client libraries and browsers are not counted,</text>
<text x="24" y="380" font-size="12" fill="#c3c2b7">except the Chromium node image.</text>
<text x="24" y="402" font-size="12" fill="#c3c2b7">The shipped Healenium-Proxy compose file, with Edge and Firefox nodes as well, comes to 4,255.4 MB.</text>
<text x="24" y="424" font-size="12" fill="#c3c2b7">Docker Hub API, linux/amd64, 2026-10-10. Data and sources: docs/charts/data.json</text>
</svg>
