name: Release

# Pushing a tag vX.Y.Z: build and test, upload to TestPyPI, then upload to PyPI once a
# reviewer approves the `pypi` environment.
# Running it by hand (Run workflow): build and test, then upload to TestPyPI only. This is a
# rehearsal and never touches PyPI.
# Uploads use trusted publishing (OIDC), so no API token is stored. See docs/RELEASING.md.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build and test the distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No pip cache here on purpose: release builds start from a clean download.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Check the tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml. Bump pyproject.toml or tag v${version}."
            exit 1
          fi

      - name: Build the sdist and wheel
        run: python -m build

      - name: Check the metadata
        run: python -m twine check --strict dist/*

      - name: Install the wheel into a fresh venv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl pytest

      - name: Run the installed command
        working-directory: ${{ runner.temp }}
        run: |
          export PATH="$RUNNER_TEMP/venv/bin:$PATH"
          mendwright --version
          python -m mendwright doctor
          mendwright demo

      - name: Run the sdist's tests against the installed wheel
        run: |
          mkdir "$RUNNER_TEMP/sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/sdist"
          cd "$RUNNER_TEMP"
          venv/bin/python -c "import mendwright, sysconfig; f = mendwright.__file__; print('testing', f, mendwright.__version__); assert f.startswith(sysconfig.get_paths()['purelib']), 'not the installed wheel'"
          venv/bin/python -m pytest -q sdist/*/tests

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-to-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/mendwright
    permissions:
      id-token: write  # trusted publishing; granted to this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI also takes each version once. A rehearsal that already uploaded this
          # version must not fail the tag run.
          skip-existing: true

  publish-to-pypi:
    name: Publish to PyPI
    needs: [build, publish-to-testpypi]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/mendwright
    permissions:
      id-token: write  # trusted publishing; granted to this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: python-package-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
