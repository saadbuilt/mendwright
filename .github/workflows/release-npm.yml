name: Release npm

# The npm package in js/. Nothing triggers this workflow yet: it runs only by hand (Run
# workflow), as release.yml does for PyPI.
# With publish left off: build and test js/, and pack it. This is a rehearsal and never
# uploads anything.
# With publish on: the same, then upload the packed file to npm once a reviewer approves the
# `npm` environment. Uploads use npm's trusted publishing (OIDC), so no npm token is stored,
# and the package gets npm provenance: a signed statement that this workflow built it from
# this commit. See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to npm after the build (off: build, test and pack only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: js

jobs:
  build:
    name: Build and test the package
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # No caches here on purpose: release builds start from a clean download.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install the Python package, for the tests that compare the two
        working-directory: .
        run: python -m pip install -e .

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"

      - name: Check this version is not on npm yet
        run: |
          version="$(node -p 'require("./package.json").version')"
          if npm view "mendwright@${version}" version >/dev/null 2>&1; then
            echo "::error::mendwright ${version} is already on npm, which never takes a version twice. Bump the version in js/package.json."
            exit 1
          fi

      - name: Install the dependencies
        run: npm ci

      - name: Typecheck and build
        run: |
          npm run typecheck
          npm run build

      - name: Run the unit suite
        env:
          MENDWRIGHT_REQUIRE_PYTHON: "1"
        run: npm test

      - name: Run the browser suite
        run: |
          npx playwright install --with-deps chromium
          npx playwright test

      - name: Pack the package
        run: npm pack

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-package
          path: js/mendwright-*.tgz
          if-no-files-found: error

  publish-to-npm:
    name: Publish to npm
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/mendwright
    permissions:
      id-token: write  # trusted publishing and provenance; granted to this job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-package
          path: js

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Install npm 11
        run: npm install -g npm@11.19.1

      - name: Publish with provenance
        run: npm publish ./mendwright-*.tgz --provenance --access public
