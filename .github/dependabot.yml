version: 2
updates:
  # Actions are pinned to commit SHAs; this keeps the pins (and their version comments) current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  # The action installs one hash-pinned lxml wheel (action/requirements.txt, made with
  # pip-compile --generate-hashes from action/requirements.in); this keeps the pin and its
  # hashes current.
  - package-ecosystem: pip
    directory: /action
    schedule:
      interval: weekly
