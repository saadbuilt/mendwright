          <div class="content-panel"><div class="sl-container">
            <h1 id="_top">Install the SDK</h1>
            <p>The SDK works in Node.js 20+, Deno and Bun. Pick your package manager.</p>
            <div class="expressive-code">
              <figure class="frame is-terminal"><figcaption class="header"><span class="title">npm</span></figcaption>
                <pre data-language="bash"><code>npm add @helio/sdk</code></pre>
                <div class="copy"><button title="Copy to clipboard" type="button">Copy</button></div>
              </figure>
            </div>
            <div class="expressive-code">
              <figure class="frame is-terminal"><figcaption class="header"><span class="title">pnpm</span></figcaption>
                <pre data-language="bash"><code>pnpm add @helio/sdk</code></pre>
                <div class="copy"><button title="Copy to clipboard" type="button">Copy</button></div>
              </figure>
            </div>
            <div class="expressive-code">
              <figure class="frame is-terminal"><figcaption class="header"><span class="title">yarn</span></figcaption>
                <pre data-language="bash"><code>yarn add @helio/sdk</code></pre>
                <div class="copy"><button title="Copy to clipboard" type="button">Copy</button></div>
              </figure>
            </div>
            <p>Then import the client and call <code>connect()</code>.</p>
          </div></div>
