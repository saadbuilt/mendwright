<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Tallyboard</title>
  <link rel="stylesheet" href="/static/css/main.8c41d2f7.css">
  <style data-emotion="css" data-s="">
    .css-1n7v3ny{display:grid;grid-template-columns:240px 1fr;grid-template-rows:56px 1fr;min-height:100vh}
    .css-18hx0ck{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;background:#111827;color:#f9fafb}
    .css-1k9bcj4{display:flex;flex-direction:column;gap:2px;padding:12px;background:#fff;border-right:1px solid #e5e7eb}
    .css-1ifw8zs{padding:24px 32px;background:#f9fafb}
    .css-1hy6j3k{background:transparent;border:0;color:inherit;padding:6px;border-radius:6px}
    .css-1kq7vxs{background:#4f46e5;color:#fff;border:0;border-radius:8px;padding:8px 14px;font-weight:600}
    .css-q2ws3e{background:#fff;color:#111827;border:1px solid #d1d5db;border-radius:8px;padding:8px 14px}
  </style>
</head>
<body>
  <div id="root">
    <div class="css-1v0f2k9" data-testid="auth-layout">
      <header class="css-3n1b6q"><a class="css-1dbjc4n" href="/" aria-label="Tallyboard home"><tb-logo></tb-logo><span class="css-901oao">Tallyboard</span></a></header>
      <main class="css-1y3b7qk">
        <section class="css-k7a0tq" aria-labelledby="signin-title">
          <h1 id="signin-title" class="css-1kx6r5">Welcome back</h1>
          <p class="css-9pa8cd">New to Tallyboard? <a class="css-4rbku5" href="/signup">Start a free trial</a></p>
          <div class="css-1w3k0t" role="group" aria-label="Single sign-on">
            <button class="css-q2ws3e" type="button">Continue with Google</button>
            <button class="css-q2ws3e" type="button">Continue with SSO</button>
          </div>
          <p class="css-1x0sd9w"><span>or sign in with email</span></p>
          <form class="css-15lh0bj" data-testid="signin-form" action="/session" method="post" novalidate>
            <div class="css-ydw3wd">
              <label class="css-u4rxok" for="signin-email">Work email</label>
              <input class="css-1x8a2b" id="signin-email" name="email" type="email" autocomplete="username" placeholder="name@company.com" required>
            </div>
            <div class="css-ydw3wd">
              <label class="css-u4rxok" for="signin-password">Password</label>
              <input class="css-1x8a2b" id="signin-password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <div class="css-1g0y4bq">
              <label class="css-hm3k2s"><input type="checkbox" name="remember"> Keep me signed in</label>
              <a class="css-4rbku5" href="/password/new">Forgot password?</a>
            </div>
            <button class="css-1kq7vxs" type="submit">Sign in</button>
          </form>
        </section>
      </main>
      <footer class="css-17w8m5x">
        <form class="css-1u8w7tj" action="/newsletter" method="post" aria-label="Product updates">
          <label class="css-u4rxok" for="updates-email">Get product updates</label>
          <input class="css-1x8a2b" id="updates-email" name="email" type="email" placeholder="you@company.com">
          <button class="css-q2ws3e" type="submit">Subscribe</button>
        </form>
        <nav class="css-1wbh2a1" aria-label="Legal">
          <a class="css-4rbku5" href="/legal/privacy">Privacy</a>
          <a class="css-4rbku5" href="/legal/terms">Terms</a>
          <a class="css-4rbku5" href="/status">Status</a>
        </nav>
        <p class="css-9pa8cd">&copy; 2026 Tallyboard Inc.</p>
      </footer>
    </div>
  </div>
</body>
</html>
